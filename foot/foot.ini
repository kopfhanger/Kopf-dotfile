# -*- conf -*-
#
# ===================================================================
# Foot 终端配置
# ===================================================================
# 终端：https://codeberg.org/dnkl/foot
# 配置参考：man foot.ini
#
# 当前主力终端（轻量 CPU 渲染）
# 显示环境：CachyOS + Niri (Noctalia)
# 主字体：Maple Mono NF CN (Nerd Font)
# ===================================================================


# ===================================================================
# 常规设置
# ===================================================================

# 字体
font=Maple Mono NF CN:weight=Regular:size=12

# DPI 感知
# no = 不使用系统 DPI，统一按 96 DPI 渲染，保证在不同缩放下的显示一致性
dpi-aware=no

# 粗体显示为亮色
# 在 ANSI 亮色/深色配色中，某些终端将粗体文本映射到 bright 色系
bold-text-in-bright=yes


# ===================================================================
# 滚动历史
# ===================================================================
[scrollback]
# lines=1000       # 滚动历史行数（默认 1000）
# multiplier=3.0    # 分页滚动倍数


# ===================================================================
# URL 处理
# ===================================================================
[url]
# 打开 URL 的方式
launch=xdg-open ${url}
# 注：Ctrl+Shift+d 绑定到 show-urls-launch（见下方键盘绑定）


# ===================================================================
# 光标样式
# ===================================================================
[cursor]
# style=block       # block | beam | underline
# blink=no          # 是否闪烁
# color=<自动>       # 光标颜色


# ===================================================================
# 鼠标行为
# ===================================================================
[mouse]
# hide-when-typing=no    # 打字时隐藏鼠标
# alternate-scroll-mode=yes  # 鼠标滚轮对 less / man 等分页程序的支持


# ===================================================================
# 深色配色方案
# ===================================================================
[colors-dark]

# 透明度 0~1（越小越透明）
# 注：需要 compositor 支持 ext-background-effect 协议（Niri + Noctalia v5 已支持）
alpha=0.85

# 背景模糊（foot v1.26+，需 ext-background-effect 协议）
blur=true

# 前景/背景色
foreground=dddddd
background=000000

# ANSI 16 色调色板

## 深色 8 色
regular0=000000  # black       — 黑色
regular1=cc0403  # red         — 红色
regular2=19cb00  # green       — 绿色
regular3=cecb00  # yellow      — 黄色
regular4=0d73cc  # blue        — 蓝色
regular5=cb1ed1  # magenta     — 洋红
regular6=0dcdcd  # cyan        — 青色
regular7=dddddd  # white       — 白色

## 亮色 8 色（加粗变体）
bright0=767676   # bright black       — 亮黑（灰色）
bright1=f2201f   # bright red         — 亮红
bright2=23fd00   # bright green       — 亮绿
bright3=fffd00   # bright yellow      — 亮黄
bright4=1a8fff   # bright blue        — 亮蓝
bright5=fd28ff   # bright magenta     — 亮洋红
bright6=14ffff   # bright cyan        — 亮青
bright7=ffffff   # bright white       — 亮白


# ===================================================================
# CSD（客户端装饰）/ 标题栏
# ===================================================================
[csd]
# preferred=server              # 使用服务端（窗口管理器）装饰
# size=26                       # 标题栏高度
# color=<前景色>                 # 标题栏文字颜色
# hide-when-typing=no           # 打字时隐藏标题栏
# border-width=0                # 边框宽度
# border-color=<csd.color>      # 边框颜色


# ===================================================================
# 键盘快捷键
# ===================================================================
[key-bindings]

# 滚动
# scrollback-up-page=Shift+Page_Up           # 向上翻页
# scrollback-up-half-page=none               # 向上翻半页
# scrollback-up-line=none                    # 向上滚一行
# scrollback-down-page=Shift+Page_Down       # 向下翻页
# scrollback-down-half-page=none             # 向下翻半页
# scrollback-down-line=none                  # 向下滚一行

# 复制 / 粘贴
# clipboard-copy=Control+Shift+c XF86Copy      # 复制到剪贴板
# clipboard-paste=Control+Shift+v XF86Paste    # 从剪贴板粘贴
# primary-paste=Shift+Insert                   # 从主选区粘贴（鼠标中键）

# 搜索
# search-start=Control+Shift+r               # 启用回滚搜索

# 字体大小调节
# font-increase=Control+plus Control+equal Control+KP_Add      # 放大
# font-decrease=Control+minus Control+KP_Subtract             # 缩小
# font-reset=Control+0 Control+KP_0                           # 重置

# 其他
# spawn-terminal=Control+Shift+n             # 打开新终端窗口
# minimize=none                               # 最小化
# maximize=none                               # 最大化
# fullscreen=none                             # 全屏

# 管道命令（选中文本传给外部程序）
# pipe-visible=...      # 管道可见行
# pipe-scrollback=...   # 管道整个回滚
# pipe-selected=...     # 管道选中文本

# URL 模式
# 进入 URL 模式后，终端内所有 URL 上会显示标签（如 s / a / d / f），
# 按对应键即可用浏览器打开该 URL。
show-urls-launch=Control+Shift+d    # Ctrl+Shift+d → 进入 URL 选择模式
# show-urls-copy=none                # 复制 URL（而非打开）
# show-urls-persistent=none          # 持久显示 URL 标签（默认只在按键后显示）

# 命令提示符跳转（需 shell 集成支持）
# prompt-prev=Control+Shift+z        # 跳到上一个提示符
# prompt-next=Control+Shift+x        # 跳到下一个提示符

# unicode-input=none                 # Unicode 输入
# noop=none                          # 空操作


# ===================================================================
# 搜索模式键绑定
# ===================================================================
[search-bindings]
# cancel=Control+g Control+c Escape                   # 取消搜索
# commit=Return                                        # 确认搜索
# find-prev=Control+r                                  # 查找上一个
# find-next=Control+s                                  # 查找下一个
# cursor-left=Left Control+b                           # 光标左移
# cursor-left-word=Control+Left Mod1+b                 # 左移一个单词
# cursor-right=Right Control+f                         # 光标右移
# cursor-right-word=Control+Right Mod1+f               # 右移一个单词
# cursor-home=Home Control+a                           # 跳转到行首
# cursor-end=End Control+e                             # 跳转到行尾
# delete-prev=BackSpace                                # 删除前一个字符
# delete-prev-word=Mod1+BackSpace Control+BackSpace    # 删除前一个单词
# delete-next=Delete                                   # 删除下一个字符
# delete-next-word=Mod1+d Control+Delete               # 删除下一个单词
# extend-to-word-boundary=Control+w                    # 扩展到单词边界
# extend-to-next-whitespace=Control+Shift+w            # 扩展到下一个空白
# clipboard-paste=Control+v Control+Shift+v Control+y XF86Paste
# primary-paste=Shift+Insert                           # 粘贴主选区
# unicode-input=none


# ===================================================================
# URL 模式键绑定
# ===================================================================
[url-bindings]
# cancel=Control+g Control+c Control+d Escape    # 取消 URL 模式
# toggle-url-visible=t                            # 切换 URL 标签可见性


# ===================================================================
# 文本映射
# ===================================================================
[text-bindings]
# 例：将 Super+c 映射为 Ctrl+c
# \x03=Mod4+c


# ===================================================================
# 鼠标键绑定
# ===================================================================
[mouse-bindings]
# selection-override-modifiers=Shift    # 按住 Shift 时临时取消选择模式
# primary-paste=BTN_MIDDLE              # 鼠标中键粘贴
# select-begin=BTN_LEFT                 # 左键开始选择
# select-begin-block=Control+BTN_LEFT   # Ctrl+左键 块选择
# select-extend=BTN_RIGHT               # 右键扩展选择
# select-extend-character-wise=Control+BTN_RIGHT  # 按字符扩展
# select-word=BTN_LEFT-2                # 双击选词
# select-word-whitespace=Control+BTN_LEFT-2  # Ctrl+双击 按空白选词
# select-row=BTN_LEFT-3                 # 三击选行
