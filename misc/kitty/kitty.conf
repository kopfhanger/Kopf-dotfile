# vim:fileencoding=utf-8:ft=conf
#
# ===================================================================
# Kitty 终端配置
# ===================================================================
# 终端：https://sw.kovidgoyal.net/kitty
# 配置参考：https://sw.kovidgoyal.net/kitty/conf.html
#
# 从 foot 配置迁移，字体、配色、透明度完全复刻。
# 显示环境：CachyOS + Niri (Noctalia)
# 主字体：Maple Mono NF CN (Nerd Font)
# ===================================================================

# ---- 字体 ----
font_family      Maple Mono NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ---- 前景 / 背景 ----
foreground              #dddddd
background              #000000
selection_foreground    #000000
selection_background    #dddddd
background_opacity 0.85
background_blur 1


# ---- 光标 ----
cursor           #dddddd
cursor_shape     block
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# ---- 光标拖尾 ----
cursor_trail 300
cursor_trail_decay 0.1 0.4

# ---- URL 处理 ----
open_url_modifiers ctrl+shift
open_url_with default

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# Colors for marks (marked text in the terminal)
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# ---- 16 色 ANSI 调色板 ----
# 配色复刻自 foot，与 WezTerm / Ghostty 保持一致

# 深色 8 色
color0  #000000
color1  #cc0403
color2  #19cb00
color3  #cecb00
color4  #0d73cc
color5  #cb1ed1
color6  #0dcdcd
color7  #dddddd

# 亮色 8 色
color8  #767676
color9  #f2201f
color10 #23fd00
color11 #fffd00
color12 #1a8fff
color13 #fd28ff
color14 #14ffff
color15 #ffffff

# ---- 滚动历史 ----
scrollback_lines 2000
scrollback_pager less +G -R

# ---- 鼠标 ----
mouse_hide_wait 0.0
wheel_scroll_multiplier 5.0
click_interval 0.5
select_by_word_characters :@-./_~?&=%+#

# ---- 窗口 ----
# 注意：hide_window_decorations 与 Kitty 透明度在 Niri 上冲突，
#       会导致聚焦时产生蓝色偏移，故不设此项。Niri 本身已无边框。
window_border_width 0
remember_window_size   no
initial_window_width   640
initial_window_height  400
repaint_delay    10
input_delay 3

# ---- 铃铛 ----
visual_bell_duration 0.0
enable_audio_bell no


# ---- Shell 集成 ----
# no-cursor = 禁止 shell 通过转义序列改变光标形状
shell_integration enabled no-cursor


# ---- 杂项 ----
term xterm-kitty
allow_remote_control yes
enabled_layouts *

# ===================================================================
# 快捷键
# ===================================================================
# 大部分使用 Kitty 默认快捷键（Ctrl+Shift 前缀）。

# --- 复制 / 粘贴 ---
map super+v             paste_from_clipboard
map ctrl+shift+s        paste_from_selection
map super+c             copy_to_clipboard
map shift+insert        paste_from_selection

# --- 滚动 ---
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end
map ctrl+shift+h         show_scrollback

# --- 字体大小 ---
map ctrl+shift+up      increase_font_size
map ctrl+shift+down    decrease_font_size
map ctrl+shift+backspace restore_font_size

# --- 窗口管理 ---
map super+n             new_os_window
map super+w             close_window
map ctrl+shift+enter    new_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window
map ctrl+shift+f        move_window_forward
map ctrl+shift+b        move_window_backward
map ctrl+shift+`        move_window_to_top
map ctrl+shift+1        first_window
map ctrl+shift+2        second_window
map ctrl+shift+3        third_window
map ctrl+shift+4        fourth_window
map ctrl+shift+5        fifth_window
map ctrl+shift+6        sixth_window
map ctrl+shift+7        seventh_window
map ctrl+shift+8        eighth_window
map ctrl+shift+9        ninth_window
map ctrl+shift+0        tenth_window

# --- 标签管理 ---
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+t        new_tab
map ctrl+shift+q        close_tab
map ctrl+shift+l        next_layout
map ctrl+shift+.        move_tab_forward
map ctrl+shift+,        move_tab_backward
