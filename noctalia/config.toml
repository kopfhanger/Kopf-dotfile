# Noctalia v5 配置文件
# 从 v4 (noctalia-shell) 移植，2025-07
# 参考: https://docs.noctalia.dev/v5/

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
corner_radius_scale    = 1.0
font_family            = "Noto Sans CJK SC"
time_format            = "{:%H:%M}"
date_format            = "%A, %x"
telemetry_enabled      = false
clipboard_enabled      = true
clipboard_history_max_entries = 100
clipboard_image_action_command = ""
middle_click_opens_widget_settings = true
settings_show_advanced = false

# lang                  = "zh-CN"
# avatar_path           = "~/下载/420px-忍野忍发型.jpg"

[shell.privacy]
mic_filter_regex = ""
cam_filter_regex = ""
screen_filter_regex = ""

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.55

[shell.panel]
transparency_mode       = "glass"
borders                 = true
shadow                  = true
launcher_placement       = "centered"
clipboard_placement      = "centered"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "attached"

[shell.launcher]
categories    = true
show_icons    = true
compact       = false
app_grid      = false
sort_by_usage = true
provider_prefix = "/"

[shell.launcher.providers.calculator]
prefix = ""
global = true

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = false

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.mpris]
blacklist = []

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"
fill_color          = "#000000"
transition          = ["fade", "disc", "stripes", "wipe", "pixelate", "honeycomb"]
transition_duration = 1500
edge_smoothness     = 0.05
directory           = "~/Pictures/Wallpapers"

[wallpaper.default]
path = ""

[wallpaper.automation]
enabled          = false
interval_minutes = 0
order            = "random"
recursive        = true

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode         = "dark"
source       = "builtin"
builtin      = "Noctalia"
pure_black_dark = false

[theme.templates]
enable_builtin_templates            = false
builtin_ids                = []
enable_community_templates = false
community_ids              = []

# ── Backdrop ──────────────────────────────────────────────────────────────────

[backdrop]
enabled        = true
blur_intensity = 0.6
tint_intensity = 0.3

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
layer              = "top"
scale              = 1.0
background_opacity = 1.0
offset_x           = 20
offset_y           = 8

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position = "top_right"
orientation = "horizontal"
scale = 1.0
background_opacity = 1.0
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
privacy = true

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled         = true
blurred_desktop = true
blur_intensity  = 0.5
tint_intensity  = 0.3

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled         = false
refresh_minutes = 30
unit            = "celsius"
effects         = true

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = false

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled              = false
force                = false
temperature_day      = 6500
temperature_night    = 4000

# ── Location ──────────────────────────────────────────────────────────────────

[location]
auto_locate = true
use12hour   = false

# ── Idle ──────────────────────────────────────────────────────────────────────

[idle.behavior.lock]
timeout  = 660
action   = "lock"
enabled  = false

[idle.behavior.screen-off]
timeout  = 600
action   = "screen_off"
enabled  = false

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate = ["return", "kp_enter", "space"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up"]
down     = ["down"]
tab_next = ["tab"]
tab_previous = ["shift+iso_left_tab"]

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position           = "top"
thickness          = 34
background_opacity = 0.93
radius             = 12
margin_h           = 5
margin_v           = 5
padding            = 2
widget_spacing     = 6
scale              = 1.0
shadow             = true
auto_hide          = false
reserve_space      = true
capsule            = true
capsule_opacity    = 1.0

start  = ["launcher", "wallpaper", "workspaces", "clock", "system-monitor", "active-window", "media"]
center = []
end    = ["tray", "notifications", "battery", "volume", "brightness", "control-center", "session"]

# ── Widget: Launcher ──────────────────────────────────────────────────────────

[widget.launcher]
custom_image = ""
custom_image_colorize = false

# ── Widget: Workspaces ────────────────────────────────────────────────────────

[widget.workspaces]
label_mode              = "index"
show_applications       = false
show_badge              = true
show_labels_only_when_occupied = true
enable_scroll_wheel     = true
pill_size               = 0.6
font_weight             = "bold"
focused_color           = "primary"
occupied_color          = "secondary"
empty_color             = "secondary"

# ── Widget: Clock ─────────────────────────────────────────────────────────────

[widget.clock]
format         = "{:%H:%M ddd, MMM dd}"
tooltip_format = "{:%H:%M ddd, MMM dd}"
font_weight    = 400

# ── Widget: System Monitor ────────────────────────────────────────────────────

[widget.system-monitor]
show_cpu_usage     = true
show_cpu_temp      = true
show_memory_usage  = true
show_memory_as_percent = true
show_network_stats = true
show_disk_usage    = true
use_monospace_font = true
compact_mode       = false

# ── Widget: Active Window ─────────────────────────────────────────────────────

[widget.active-window]
max_width         = 145
show_icon         = true
show_text         = true
scrolling_mode    = "hover"

# ── Widget: Media ─────────────────────────────────────────────────────────────

[widget.media]
max_width          = 145
show_artist_first  = true
show_progress_ring = true
scrolling_mode     = "hover"
compact_mode       = false

# ── Widget: Tray ──────────────────────────────────────────────────────────────

[widget.tray]
drawer_enabled = true
pinned = []

# ── Widget: Notifications ─────────────────────────────────────────────────────

[widget.notifications]
hide_when_no_unread = true

# ── Widget: Battery ───────────────────────────────────────────────────────────

[widget.battery]
hide_if_not_detected = true
display_mode = "onhover"

# ── Widget: Volume ────────────────────────────────────────────────────────────

[widget.volume]
display_mode = "onhover"
middle_click_command = "pwvucontrol || pavucontrol"

# ── Widget: Brightness ────────────────────────────────────────────────────────

[widget.brightness]
display_mode = "onhover"

# ── Widget: Control Center ────────────────────────────────────────────────────

[widget.control-center]
custom_image = ""
custom_image_colorize = false

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled             = true
position            = "bottom"
icon_size           = 48
background_opacity  = 1.0
radius              = 6
margin_h            = 0
margin_v            = 0
shadow              = true
show_running        = true
auto_hide           = true
reserve_space       = false
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.85
show_dots           = false
show_instance_count = true
launcher_position   = "none"
active_monitor_only = true
pinned              = []

# ── Desktop Widgets ───────────────────────────────────────────────────────────

[desktop_widgets]
enabled = false

# ── Control Center ────────────────────────────────────────────────────────────

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "nightlight"

# ── Hooks ─────────────────────────────────────────────────────────────────────

[hooks]
battery_low_percent_threshold = 0
